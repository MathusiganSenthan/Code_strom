# =============================================================================
# docker-compose.yml - Redis Vector Database Setup
# =============================================================================

version: "3.8"

services:
  redis:
    image: redis/redis-stack:latest
    container_name: legal-analyzer-redis
    ports:
      - "6379:6379" # Redis port
      - "8001:8001" # RedisInsight web UI port
    environment:
      - REDIS_ARGS=--requirepass yourpassword
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "yourpassword", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis_data:
    driver: local
