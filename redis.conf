# Redis configuration for Legal Document Analyzer Vector Database
# =============================================================================

# Basic settings
port 6379
bind 0.0.0.0
requirepass yourpassword

# Memory settings
maxmemory 1gb
maxmemory-policy allkeys-lru

# Persistence settings
save 900 1
save 300 10
save 60 10000

# Enable AOF for better durability
appendonly yes
appendfsync everysec

# Redis Modules (Redis Stack includes these)
loadmodule /opt/redis-stack/lib/redisearch.so
loadmodule /opt/redis-stack/lib/rejson.so

# Vector search specific settings
# These are automatically configured by Redis Stack

# Logging
loglevel notice
logfile /var/log/redis/redis-server.log

# Security
protected-mode yes

# Client connection settings
timeout 300
tcp-keepalive 300
tcp-backlog 511

# Performance tuning
databases 16
hz 10
